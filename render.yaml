# Render Blueprint (must live at repo root): New + → Blueprint → pick this repo. Free plan, Docker runtime.
services:
  - type: web
    name: rokid-hud-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile   # relative to rootDir
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: DATA_DIR
        value: /app/data
      - key: API_KEY
        sync: false          # "sync: false" = you type the value in the Render dashboard
      - key: ICLOUD_USER
        sync: false
      - key: ICLOUD_APP_PASSWORD
        sync: false
      - key: CALENDARS
        sync: false
      - key: OWM_API_KEY
        sync: false
      # Assistant providers. Keys stay here, never on the phone, so they can be rotated in one
      # place and a lost device leaks nothing. Set whichever you use; the other can stay blank.
      - key: ASSISTANT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LAT
        sync: false
      - key: LON
        sync: false
      - key: UNITS
        value: metric
      - key: CITY
        value: Melbourne
      - key: TZ
        value: Australia/Melbourne
      - key: SYNC_INTERVAL_MIN
        value: "15"
